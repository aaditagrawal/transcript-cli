[project]
name = "transcript-cli"
version = "0.1.0"
description = "High-performance multi-engine audio/video transcription CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mav" }]
keywords = ["transcription", "whisper", "speech-to-text", "audio", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",
    "platformdirs>=4.11.1",
]

[project.optional-dependencies]
# Faster Whisper - works on NVIDIA GPU and CPU
faster = [
    # Upstream fix preserves PyAV <19 metadata handling and supports PyAV 19.
    "faster-whisper @ git+https://github.com/SYSTRAN/faster-whisper.git@2ce7f9d7a9fbe315a5804a33bf7224d42e101174",
]

# Insanely Fast Whisper - NVIDIA GPU with maximum throughput
insanely = [
    "transformers[torch]>=5.20.2",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "flash-attn>=2.8.3.post2; platform_system != 'Darwin'",
]

# Parakeet TDT v3 - NVIDIA model through the maintained Transformers runtime
parakeet = [
    "transformers[torch]>=5.20.2",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
]

# MLX Whisper - Apple Silicon native
apple = [
    "mlx-whisper>=0.4.3",
]

# All NVIDIA engines
nvidia = [
    "transcript-cli[faster,insanely,parakeet]",
]

# Build tools for creating standalone binaries
build = [
    "pyinstaller>=6.22.3",
    "nuitka>=4.3.1",
]

# Kept for `pip install .[dev]` callers; prefer `uv sync --group dev`.
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[project.scripts]
transcript = "transcript_cli.main:app"

[project.urls]
Homepage = "https://github.com/aaditagrawal/transcript-cli"
Repository = "https://github.com/aaditagrawal/transcript-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The Faster Whisper extra pins a vetted upstream compatibility fix.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line length handled by formatter
    "B904", # typer.Exit / CLI re-raises do not need exception chaining
]

[tool.ruff.lint.isort]
known-first-party = ["transcript_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

# PyInstaller configuration hints
[tool.pyinstaller]
name = "transcript"
onefile = true
console = true
